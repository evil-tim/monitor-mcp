[project]
name = "monitor-mcp"
version = "0.1.0"
description = "Constraint-enforced signal registry and trigger watch for PSE and macro monitoring."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # pin the major: a bump can move decorator kwargs and CLI subcommands under us
    "fastmcp>=3.2.4,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monitor_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
